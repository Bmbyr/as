<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Амьтдын зураг (Bootstrap хувилбар)</title>

    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ✅ Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 class="fw-bold text-center mt-4">Амьтдын зураг</h1>
        <p class="text-muted text-center mb-4">Нэрээр нь хайж зураг шүүж үзэх боломжтой</p>
    </header>

    <main class="container mb-5">
        <!-- ✅ Хайлт -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control form-control-lg shadow-sm"
                    placeholder="Амьтдын нэрээр хайх... (жишээ: Тэмээ, Морь)">
            </div>
        </div>

        <!-- ✅ Галлерей -->
        <div class="row g-4" id="gallery">

            <!-- Тэмээ -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="temee.jpg" class="card-img-top" alt="Тэмээ">
                    <div class="card-body">
                        <h6 class="animal-name">Тэмээ</h6>
                    </div>
                </div>
            </div>

            <!-- Барс -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="bars.jpg" class="card-img-top" alt="Барс">
                    <div class="card-body">
                        <h6 class="animal-name">Барс</h6>
                    </div>
                </div>
            </div>

            <!-- Морь -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="mori.jpg" class="card-img-top" alt="Морь">
                    <div class="card-body">
                        <h6 class="animal-name">Морь</h6>
                    </div>
                </div>
            </div>

            <!-- Хонь -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="sheep.jpg" class="card-img-top" alt="Хонь">
                    <div class="card-body">
                        <h6 class="animal-name">Хонь</h6>
                    </div>
                </div>
            </div>

            <!-- Туулай -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="tuulai.jpg" class="card-img-top" alt="Туулай">
                    <div class="card-body">
                        <h6 class="animal-name">Туулай</h6>
                    </div>
                </div>
            </div>

            <!-- Нохой -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="nohoi.jpg" class="card-img-top" alt="Нохой">
                    <div class="card-body">
                        <h6 class="animal-name">Нохой</h6>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="nohoi2.jpg" class="card-img-top" alt="Нохой">
                    <div class="card-body">
                        <h6 class="animal-name">Нохой</h6>
                    </div>
                </div>
            </div>

            <!-- Гахай -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="pig.jpg" class="card-img-top" alt="Гахай">
                    <div class="card-body">
                        <h6 class="animal-name">Гахай</h6>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="pig2.jpg" class="card-img-top" alt="Гахай">
                    <div class="card-body">
                        <h6 class="animal-name">Гахай</h6>
                    </div>
                </div>
            </div>

            <!-- Сармагчин -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="monkey.jpg" class="card-img-top" alt="Сармагчин">
                    <div class="card-body">
                        <h6 class="animal-name">Сармагчин</h6>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="monkey2.jpg" class="card-img-top" alt="Сармагчин">
                    <div class="card-body">
                        <h6 class="animal-name">Сармагчин</h6>
                    </div>
                </div>
            </div>

                    <img src="crocodile.jpg" class="card-img-top" alt="Матар">
                    <div class="card-body">

                    </div>
                </div>
            </div>

            <!-- Баавгай -->

                    <img src="bear.jpg" class="card-img-top" alt="Баавгай">

            </div>

                <div class="card text-center p-2">
                    <img src="bear2.jpg" class="card-img-top" alt="Баавгай">
                    <div class="card-body">
                        <h6 class="animal-name">Баавгай</h6>
                    </div>
                </div>
            </div>

            <!-- Яст мэлхий -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="turtle.jpg" class="card-img-top" alt="Яст мэлхий">
                    <div class="card-body">
                        <h6 class="animal-name">Яст мэлхий</h6>
                    </div>
                </div>
            </div>

            <!-- Халим -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="whale.jpg" class="card-img-top" alt="Халим">
                    <div class="card-body">
                        <h6 class="animal-name">Халим</h6>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-4 col-lg-3 animal-card">

                    <img src="whale2.jpg" class="card-img-top" alt="Халим">
                    <div class="card-body">
                        <h6 class="animal-name">Халим</h6>
                    </div>
                </div>
            </div>

            <!-- Үхэр -->
            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="cow.jpg" class="card-img-top" alt="Үхэр">

                    <img src="cat.jpg" class="card-img-top" alt="Муур">
                    <div class="card-body">
                        <h6 class="animal-name">Муур</h6>

                </div>
            </div>

            <div class="col-6 col-md-4 col-lg-3 animal-card">
                <div class="card text-center p-2">
                    <img src="cat2.jpg" class="card-img-top" alt="Муур">
                    <div class="card-body">
                        <h6 class="animal-name">Муур</h6>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-3">
        © Амьтдын галлерей
    </footer>

    <!-- ✅ Custom JS -->
    <script src="script.js"></script>

    <!-- ✅ Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
